name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.GIRKA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/girka.jks"
          echo "GIRKA_KEYSTORE_PATH=$RUNNER_TEMP/girka.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          GIRKA_KEYSTORE_PASSWORD: ${{ secrets.GIRKA_KEYSTORE_PASSWORD }}
          GIRKA_KEY_ALIAS: ${{ secrets.GIRKA_KEY_ALIAS }}
          GIRKA_KEY_PASSWORD: ${{ secrets.GIRKA_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))

      - uses: actions/upload-artifact@v4
        with:
          name: girka-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Без постоянного ключа релиз не публикуется: APK с отладочной подписью не встанет поверх подписанного.
      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk girka.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest girka.apk \
            --title "Гирька, сборка №${GITHUB_RUN_NUMBER}" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте girka.apk на телефон и установите." \
            --target "$GITHUB_SHA"

  # iOS собирается без подписи: .app проверяет, что проект компилируется.
  # Для установки на iPhone и TestFlight нужна учётная запись Apple Developer.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: Package the unsigned app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr girka-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: girka-ios-unsigned
          path: girka-unsigned.ipa
          if-no-files-found: error
